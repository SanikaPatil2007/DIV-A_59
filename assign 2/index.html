<!DOCTYPE html>
<html>
<head>
    <title>Food Corner</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">Food Corner</a>
        </div>
    </nav>

    <!-- Heading -->
    <div class="container text-center mt-5">
        <h1>Welcome to Food Corner</h1>
        <p class="text-secondary">Choose your favorite food</p>
    </div>

    <!-- Food Cards -->
    <div class="container mt-4">

        <div class="row">

            <!-- Pizza -->
            <div class="col-md-4">
                <div class="card text-center mb-4">
                    <div class="card-body">
                        <h3 class="card-title">Pizza</h3>

                        <p class="card-text">
                            Cheesy and delicious pizza.
                        </p>

                        <h5>₹199</h5>

                        <button class="btn btn-primary">
                            Order Now
                        </button>
                    </div>
                </div>
            </div>

            <!-- Burger -->
            <div class="col-md-4">
                <div class="card text-center mb-4">
                    <div class="card-body">
                        <h3 class="card-title">Burger</h3>

                        <p class="card-text">
                            Fresh and tasty burger.
                        </p>

                        <h5>₹149</h5>

                        <button class="btn btn-success">
                            Order Now
                        </button>
                    </div>
                </div>
            </div>

            <!-- Pasta -->
            <div class="col-md-4">
                <div class="card text-center mb-4">
                    <div class="card-body">
                        <h3 class="card-title">Pasta</h3>

                        <p class="card-text">
                            Creamy and delicious pasta.
                        </p>

                        <h5>₹179</h5>

                        <button class="btn btn-warning">
                            Order Now
                        </button>
                    </div>
                </div>
            </div>

        </div>

    </div>

</body>
</html>
